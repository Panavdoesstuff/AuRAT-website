<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA · Guardian Ring</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06090f; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
#wrap { width: 100vw; height: 100vh; background: #06090f; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
#title { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-family: monospace; font-size: 11px; letter-spacing: 3px; color: #4a9eff; opacity: 0.6; white-space: nowrap; }
#lbls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: monospace; font-size: 10px; color: #4a9eff; opacity: 0.35; letter-spacing: 1px; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="title">AURA · GUARDIAN RING</div>
  <div id="lbls"></div>
  <div id="hint">drag to rotate · scroll to zoom</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const wrap=document.getElementById('wrap'),canvas=document.getElementById('c'),lbls=document.getElementById('lbls');
const W=wrap.clientWidth,H=wrap.clientHeight;
canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
canvas.style.width=W+'px';canvas.style.height=H+'px';
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(devicePixelRatio);renderer.setSize(W,H);renderer.setClearColor(0x06090f,1);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,100);
scene.add(new THREE.AmbientLight(0x334466,0.8));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(5,8,5);scene.add(sun);
const rim=new THREE.DirectionalLight(0x4488ff,0.8);rim.position.set(-5,3,-3);scene.add(rim);
const spot=new THREE.PointLight(0xffffff,1.5,15);spot.position.set(0,5,5);scene.add(spot);
const gemLight=new THREE.PointLight(0x66aaff,2,10);gemLight.position.set(0,3,3);scene.add(gemLight);
scene.add(new THREE.PointLight(0xffffff,0.8,10));
 
const group=new THREE.Group();scene.add(group);
 
const silverMat=new THREE.MeshStandardMaterial({color:0x8899aa,metalness:0.8,roughness:0.2});
const silverDarkMat=new THREE.MeshStandardMaterial({color:0x556677,metalness:0.8,roughness:0.3});
const gemMat=new THREE.MeshStandardMaterial({color:0x66aaff,metalness:0.0,roughness:0.0,transparent:true,opacity:0.88,emissive:0x1133aa,emissiveIntensity:0.4});
const gemFacetMat=new THREE.MeshStandardMaterial({color:0x99ccff,metalness:0.0,roughness:0.0,transparent:true,opacity:0.7,emissive:0x2244cc,emissiveIntensity:0.2});
const darkMat=new THREE.MeshStandardMaterial({color:0x222222,metalness:0.1,roughness:0.8});
const glassMat=new THREE.MeshStandardMaterial({color:0x334455,metalness:0.5,roughness:0.1,transparent:true,opacity:0.92});
const blueMat=new THREE.MeshStandardMaterial({color:0x4499ff,metalness:0.5,roughness:0.2,emissive:0x1133cc,emissiveIntensity:0.6});
 
// BAND
const band=new THREE.Mesh(new THREE.TorusGeometry(1.0,0.095,64,200),silverMat);
band.rotation.x=Math.PI/2;group.add(band);
 
// Collar thickening near setting
const collar=new THREE.Mesh(new THREE.TorusGeometry(1.0,0.11,32,60,Math.PI*0.7),silverMat);
collar.rotation.x=Math.PI/2;collar.rotation.y=-Math.PI*0.35+Math.PI/2;group.add(collar);
 
// MINIMAL HIDDEN BASE
const settingBase=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.02,32),silverDarkMat);
settingBase.position.set(0,0,1.0);settingBase.rotation.x=Math.PI/2;group.add(settingBase);
 
// LARGE GEM
const gemGeo=new THREE.OctahedronGeometry(0.38,1);
const gemPos=gemGeo.attributes.position;
for(let i=0;i<gemPos.count;i++) gemPos.setY(i,gemPos.getY(i)*0.55);
gemGeo.computeVertexNormals();
const gem=new THREE.Mesh(gemGeo,gemMat);
gem.position.set(0,0,1.02);gem.rotation.x=Math.PI/2;gem.rotation.z=Math.PI/6;gem.scale.set(1.0,1.0,1.1);group.add(gem);
const gemInner=new THREE.Mesh(new THREE.OctahedronGeometry(0.3,0),gemFacetMat);
gemInner.position.set(0,0,1.02);gemInner.rotation.x=Math.PI/2;gemInner.rotation.z=Math.PI/4;group.add(gemInner);
 

 
// CAMERA near the gem setting (Subtle)
const cA=(12*Math.PI/180),cR=1.0,cOut=0.102;
const cX=Math.sin(cA)*cR,cZ=Math.cos(cA)*cR,cNX=Math.sin(cA),cNZ=Math.cos(cA);
const ch=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.02,32),silverMat);
ch.position.set(cX+cNX*cOut,0,cZ+cNZ*cOut);ch.rotation.x=Math.PI/2;ch.rotation.y=-cA;group.add(ch);
const cl=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.015,32),glassMat);
cl.position.set(cX+cNX*(cOut+0.01),0,cZ+cNZ*(cOut+0.01));cl.rotation.x=Math.PI/2;cl.rotation.y=-cA;group.add(cl);

// SUBTLE SIDE MIC
const mA=(250*Math.PI/180),mR=1.0,mOut=0.095;
const mX=Math.sin(mA)*mR,mZ=Math.cos(mA)*mR,mNX=Math.sin(mA),mNZ=Math.cos(mA);
const mh=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.01,32),silverDarkMat);
mh.position.set(mX+mNX*mOut,0,mZ+mNZ*mOut);mh.rotation.x=Math.PI/2;mh.rotation.y=-mA;group.add(mh);
const md=new THREE.Mesh(new THREE.SphereGeometry(0.008,8,8),darkMat);
md.position.set(mX+mNX*(mOut+0.008),0,mZ+mNZ*(mOut+0.008));group.add(md);

// INTERNAL BIOMETRIC SENSORS (Heart Rate & GSR)
const hA=(180*Math.PI/180),hR=1.0,hIn=0.088;
const hX=Math.sin(hA)*hR,hZ=Math.cos(hA)*hR,hNX=Math.sin(hA),hNZ=Math.cos(hA);
const heartSensor=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.06,0.01),darkMat);
heartSensor.position.set(hX-hNX*hIn,0,hZ-hNZ*hIn);heartSensor.rotation.y=-hA;group.add(heartSensor);
const ppg=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8),new THREE.MeshBasicMaterial({color:0xff0000}));
ppg.position.set(hX-hNX*(hIn+0.005),0,hZ-hNZ*(hIn+0.005));group.add(ppg);

// GSR CONTACTS
[-0.08, 0.08].forEach(off=>{
  const gA=((180+25)*Math.PI/180),gR=1.0,gIn=0.09;
  const gX=Math.sin(gA)*gR,gZ=Math.cos(gA)*gR,gNX=Math.sin(gA),gNZ=Math.cos(gA);
  const contact=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.005,16),silverMat);
  contact.position.set(gX-gNX*gIn,off,gZ-gNZ*gIn);contact.rotation.y=-gA;contact.rotation.x=Math.PI/2;group.add(contact);
});
 

 
// GRID
const grid=new THREE.GridHelper(10,30,0x0a1a33,0x0a1a33);
grid.position.y=-1.8;scene.add(grid);
 
// ANNOTATIONS
const annots=[
  {local:new THREE.Vector3(0,0.1,1.15),label:'BLUE SAPPHIRE',sub:'AI status gem',side:1},
  {local:new THREE.Vector3(cX+cNX*(cOut+0.01),0,cZ+cNZ*(cOut+0.01)),label:'CAMERA',sub:'5MP · flush-mounted',side:1},
  {local:new THREE.Vector3(mX+mNX*(mOut+0.01),0,mZ+mNZ*(mOut+0.01)),label:'MICROPHONE',sub:'side-mounted port',side:-1},
  {local:new THREE.Vector3(hX-hNX*hIn,0,hZ-hNZ*hIn),label:'BIO-SENSOR',sub:'Heart Rate · Breath',side:-1},
  {local:new THREE.Vector3(Math.sin((180+25)*Math.PI/180)*1.0-Math.sin((180+25)*Math.PI/180)*0.09,0,Math.cos((180+25)*Math.PI/180)*1.0-Math.cos((180+25)*Math.PI/180)*0.09),label:'GSR CONTACTS',sub:'Stress detection',side:-1},
];
 
function updateLabels(){
  lbls.innerHTML='';
  const vw=wrap.clientWidth,vh=wrap.clientHeight;
  annots.forEach(a=>{
    const w=a.local.clone();group.localToWorld(w);
    const p=w.project(cam);if(p.z>=1)return;
    const sx=(p.x*.5+.5)*vw,sy=(-p.y*.5+.5)*vh;
    const dot=document.createElement('div');
    dot.style.cssText=`position:absolute;left:${sx-4}px;top:${sy-4}px;width:8px;height:8px;border-radius:50%;border:1.5px solid #4a9eff;background:rgba(74,158,255,0.25);`;
    lbls.appendChild(dot);
    const off=a.side>0?`left:${sx+12}px;top:${sy}px;transform:translateY(-50%);text-align:left;`:`left:${sx-12}px;top:${sy}px;transform:translate(-100%,-50%);text-align:right;`;
    const el=document.createElement('div');
    el.style.cssText='position:absolute;'+off;
    el.innerHTML=`<div style="font-family:monospace;font-size:13px;color:#4a9eff;letter-spacing:1.5px;font-weight:600;">${a.label}</div><div style="font-family:monospace;font-size:11px;color:#4a9eff;opacity:0.5;">${a.sub}</div>`;
    lbls.appendChild(el);
  });
}
 
// CONTROLS
let rotX=0.25,rotY=0.5,zoom=4.5,drag=false,px2=0,py2=0,auto=true;
wrap.addEventListener('mousedown',e=>{drag=true;px2=e.clientX;py2=e.clientY;auto=false;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  rotY+=(e.clientX-px2)*0.013;rotX+=(e.clientY-py2)*0.013;
  rotX=Math.max(-1.2,Math.min(1.2,rotX));px2=e.clientX;py2=e.clientY;
});
wrap.addEventListener('wheel',e=>{zoom=Math.max(2.5,Math.min(10,zoom+e.deltaY*.008));e.preventDefault();},{passive:false});
let lt=null;
wrap.addEventListener('touchstart',e=>{lt=e.touches[0];auto=false;});
wrap.addEventListener('touchmove',e=>{
  if(!lt)return;const t=e.touches[0];
  rotY+=(t.clientX-lt.clientX)*.015;rotX+=(t.clientY-lt.clientY)*.015;
  rotX=Math.max(-1.2,Math.min(1.2,rotX));lt=t;e.preventDefault();
},{passive:false});
 
function animate(){
  requestAnimationFrame(animate);
  if(auto)rotY+=0.005;
  group.rotation.x=rotX;group.rotation.y=rotY;
  cam.position.set(0,zoom*0.42,zoom);cam.lookAt(0,0.1,0);
  renderer.render(scene,cam);updateLabels();
}
window.addEventListener('resize',()=>{
  const w=wrap.clientWidth,h=wrap.clientHeight;
  canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
});

animate();
</script>
</body>
</html>
